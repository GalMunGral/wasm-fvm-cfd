<!DOCTYPE html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 60px;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    #panel {
      width: 300px;
      flex-shrink: 0;
      color: #fff;
      overflow-y: auto;
      scrollbar-width: none;
    }

    #panel h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
      margin: 20px 0 10px;
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
    }

    .row label {
      width: 100px;
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
    }

    .row input[type=range] {
      flex: 1;
      accent-color: #aaa;
      cursor: pointer;
    }

    .row span {
      width: 52px;
      font-size: 11px;
      text-align: right;
      color: #ccc;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, monospace;
      flex-shrink: 0;
    }
  </style>
</head>
<div id="panel">
  <h1>wasm-fvm-cfd</h1>

  <div class="section-title">Global</div>
  <div class="row">
    <label>viscosity ν</label>
    <input type="range" id="nu" min="0.001" max="0.05" step="0.001" value="0.01">
    <span></span>
  </div>

  <template id="wall-template">
    <div class="section-title"></div>
    <div class="row">
      <label>wavenumber k</label>
      <input type="range" data-param="k" min="0" max="8" step="0.5">
      <span></span>
    </div>
    <div class="row">
      <label>frequency ω</label>
      <input type="range" data-param="omega" min="-20" max="20" step="0.5">
      <span></span>
    </div>
    <div class="row">
      <label>amplitude</label>
      <input type="range" data-param="amp" min="0" max="2" step="0.1">
      <span></span>
    </div>
  </template>
  <div id="wall-controls"></div>
</div>
<canvas id="plot" style="height: calc(100vh - 120px); aspect-ratio: 1 / 1"></canvas>
<script src="solver.js"></script>
<script type="module" src="/src/index.ts"></script>
